<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D & 3D Floor Plan Designer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 130px;
            background: #34495e;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            border-left: 2px solid #1a252f;
            z-index: 10;
            padding-bottom: 60px;
        }
        .tool-btn {
            width: 100%;
            padding: 12px 5px;
            background: #34495e;
            border: none;
            border-bottom: 1px solid #2c3e50;
            color: white;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .tool-btn:hover {
            background: #1abc9c;
        }
        .tool-icon {
            font-size: 18px;
        }
        #canvas-container {
            flex-grow: 1;
            height: 100vh;
            background: #3b4a5a;
            position: relative;
        }
        canvas {
            display: block;
        }
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: calc(100% - 130px);
            background: #22313f;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 10;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
        }
        .bottom-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .bottom-btn:hover {
            color: #1abc9c;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="planCanvas"></canvas>
    </div>

    <div id="bottom-bar">
        <button class="bottom-btn" onclick="undoAction()"><span>↩️</span> Undo</button>
        <button class="bottom-btn" onclick="redoAction()"><span>↪️</span> Redo</button>
        <button class="bottom-btn" onclick="pasteAction()"><span>📋</span> Paste</button>
        <button class="bottom-btn" onclick="toggleViewMode()"><span id="view-icon">🎲</span> <span id="view-text">3D View</span></button>
        <button class="bottom-btn" onclick="shareApp()"><span>🔗</span> Share</button>
        <button class="bottom-btn" onclick="exportPlan()"><span>📥</span> Export</button>
        <button class="bottom-btn" onclick="openFloors()"><span>🥞</span> Floors</button>
    </div>

    <div id="sidebar">
        <button class="tool-btn" onclick="addShape('Square')"><span class="tool-icon">⬜</span> Square</button>
        <button class="tool-btn" onclick="addShape('L-Shape')"><span class="tool-icon">📐</span> L-Shape</button>
        <button class="tool-btn" onclick="addShape('U-Shape')"><span class="tool-icon">🪟</span> U-Shape</button>
        <button class="tool-btn" onclick="addShape('T-Shape')"><span class="tool-icon">🔲</span> T-Shape</button>
        <button class="tool-btn" onclick="addShape('Walls')"><span class="tool-icon">〰️</span> Walls</button>
        <button class="tool-btn" onclick="addShape('Stairs')"><span class="tool-icon">📶</span> Stairs</button>
        <button class="tool-btn" onclick="addShape('Landing')"><span class="tool-icon">⏸️</span> Landing</button>
        <button class="tool-btn" onclick="addShape('Circular stairs')"><span class="tool-icon">🌀</span> Circular stairs</button>
    </div>

    <script>
        const canvas = document.getElementById('planCanvas');
        const ctx = canvas.getContext('2d');
        let shapes = [];
        let is3D = false;

        function resizeCanvas() {
            canvas.width = document.getElementById('canvas-container').clientWidth;
            canvas.height = document.getElementById('canvas-container').clientHeight;
            drawCanvas();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function addShape(type) {
            const newObj = {
                type: type,
                x: canvas.width / 2 + (Math.random() - 0.5) * 100,
                y: canvas.height / 2 + (Math.random() - 0.5) * 100,
                width: 100,
                height: 100
            };
            shapes.push(newObj);
            drawCanvas();
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid background
            ctx.strokeStyle = '#4e5d6c';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw shapes
            shapes.forEach(shape =
> {
                ctx.save();
                if (is3D) {
                    // Simple 3D Isometric shadow effect
                    ctx.fillStyle = '#7f8c8d';
                    ctx.fillRect(shape.x + 10, shape.y + 10, shape.width, shape.height);
                }
                ctx.fillStyle = '#1abc9c';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.fillRect(shape.x, shape.y, shape.width, shape.height);
                ctx.strokeRect(shape.x, shape.y, shape.width, shape.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.fillText(shape.type, shape.x + 10, shape.y + 25);
                ctx.restore();
            });
        }

        function undoAction() {
            shapes.pop();
            drawCanvas();
        }

        function redoAction() {
            alert("Redo অপশন প্রস্তুত রয়েছে।");
        }

        function pasteAction() {
            alert("ক্লিপবোর্ড থেকে পেস্ট করা হয়েছে।");
        }

        function toggleViewMode() {
            is3D = !is3D;
            document.getElementById('view-text').innerText = is3D ? "2D View" : "3D View";
            drawCanvas();
        }

        function shareApp() {
            alert("শেয়ার লিংক তৈরি করা হয়েছে।");
        }

        function exportPlan() {
            alert("ফ্লোর প্ল্যান এক্সপোর্ট করা হচ্ছে...");
        }

        function openFloors() {
            alert("ফ্লোর ম্যানেজার খোলা হয়েছে।");
        }
    </script>
</body>
</html>
